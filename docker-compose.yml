services:
  db:
    image: mysql:8.4
    container_name: mysql-panaderia
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: panaderia
    ports:
      - "3307:3306"
    volumes:
      - panaderia_mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin-panaderia
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db

volumes:
  panaderia_mysql_data:
