services:
  db:
    image: mysql:8.4
    container_name: mysql-panaderia
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: panaderia
    ports:
      - "3307:3306"
    volumes:
      - panaderia_mysql_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin-panaderia
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db

  web:
    build: .
    container_name: panaderia-web
    restart: on-failure
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
    depends_on:
      - db

volumes:
  panaderia_mysql_data:
