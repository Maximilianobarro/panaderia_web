{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Panadería Zulca</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>
<body>
    {% include 'core/_menu.html' %}

    <main class="auth-card">
        <h1>Iniciar sesión</h1>

        {% if error %}<p class="mensaje mensaje-error">{{ error }}</p>{% endif %}

        <form method="POST">
            {% csrf_token %}
            <label for="nombre_usuario">Usuario</label>
            <input type="text" id="nombre_usuario" name="nombre_usuario" required autocomplete="username">

            <label for="clave">Clave</label>
            <input type="password" id="clave" name="clave" required autocomplete="current-password">

            <button type="submit">Ingresar</button>
        </form>

        <a class="enlace" href="{% url 'recuperar_clave' %}">¿Olvidaste tu contraseña?</a>
    </main>
</body>
</html>
