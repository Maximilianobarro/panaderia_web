{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva clave - Panadería Zulca</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>
<body>
    {% include 'core/_menu.html' %}

    <main class="auth-card">
        <h1>Nueva contraseña</h1>
        <p>Usuario: <strong>{{ usuario.nombre_usuario }}</strong>. Mínimo 8 caracteres. Tenés 10 minutos para completarlo.</p>

        {% if error %}<p class="mensaje mensaje-error">{{ error }}</p>{% endif %}

        <form method="POST">
            {% csrf_token %}
            <label for="clave_nueva">Nueva clave</label>
            <input type="password" id="clave_nueva" name="clave_nueva" minlength="8" required autocomplete="new-password">

            <label for="clave_confirmar">Confirmar clave</label>
            <input type="password" id="clave_confirmar" name="clave_confirmar" minlength="8" required autocomplete="new-password">

            <button type="submit">Guardar</button>
        </form>

        <a class="enlace" href="{% url 'login_usuario' %}">Cancelar</a>
    </main>
</body>
</html>
