<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Confirmar borrado - Panadería Zulca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    {% include 'core/_menu.html' %}
    <div class="container mb-5">
        <h1 class="mb-4">¿Confirmás que querés borrar esto?</h1>
        <p class="bg-white p-3 rounded shadow-sm">{{ object }}</p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sí, borrar</button>
            <a href="{% url volver_url %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>
</html>
