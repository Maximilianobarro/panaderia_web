<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cierre de caja - Panadería Zulca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    {% include 'core/_menu.html' %}
    <div class="container mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="mb-0">Cierre de caja</h1>
            <a href="{% url 'venta_lista' %}" class="btn btn-secondary">Volver</a>
        </div>

        <div class="bg-white p-3 rounded mb-3">
            <strong>Turno:</strong> desde {{ desde_txt }} hasta ahora ({{ hasta_txt }})
            · <strong>Ventas registradas:</strong> {{ datos.cantidad_ventas }}
        </div>

        {% include 'core/_caja_detalle.html' %}

        <form method="post" class="bg-white p-3 rounded">
            {% csrf_token %}
            <label class="form-label" for="observacion">Observación (opcional)</label>
            <input type="text" id="observacion" name="observacion" maxlength="200" class="form-control mb-3">
            <button type="submit" class="btn btn-warning" onclick="return confirm('¿Estás seguro? Al cerrar la caja se registra el turno y no se puede deshacer.');">Cerrar caja</button>
        </form>
    </div>
</body>
</html>
