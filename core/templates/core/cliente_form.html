<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% if cliente %}Editar{% else %}Nuevo{% endif %} Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4">
            {% if cliente %}Editar Cliente{% else %}Nuevo Cliente{% endif %}
        </h1>

        <form method="POST" class="bg-white p-4 rounded shadow-sm">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" name="nombre" class="form-control"
                       value="{% if cliente %}{{ cliente.nombre }}{% endif %}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Apellido</label>
                <input type="text" name="apellido" class="form-control"
                       value="{% if cliente %}{{ cliente.apellido }}{% endif %}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control"
                       value="{% if cliente %}{{ cliente.email }}{% endif %}">
            </div>
            <div class="row">
                <div class="col-md-8 mb-3">
                    <label class="form-label">Calle</label>
                    <input type="text" name="calle" class="form-control"
                           value="{% if cliente %}{{ cliente.calle }}{% endif %}">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Número</label>
                    <input type="text" name="numero" class="form-control"
                           value="{% if cliente %}{{ cliente.numero }}{% endif %}">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Ciudad</label>
                <input type="text" name="ciudad" class="form-control"
                       value="{% if cliente %}{{ cliente.ciudad }}{% endif %}">
            </div>
            <button type="submit" class="btn btn-success">Guardar</button>
            <a href="{% url 'lista_clientes' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>
</html>
