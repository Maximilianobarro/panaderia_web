{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar clave - Panadería Zulca</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>
<body>
    {% include 'core/_menu.html' %}

    <main class="auth-card">
        <h1>Recuperar contraseña</h1>
        <p>Ingresá tus datos para verificar tu identidad.</p>

        {% if error %}<p class="mensaje mensaje-error">{{ error }}</p>{% endif %}

        <form method="POST">
            {% csrf_token %}
            <label for="nombre_usuario">Usuario</label>
            <input type="text" id="nombre_usuario" name="nombre_usuario" required>

            <label for="dni">DNI</label>
            <input type="text" id="dni" name="dni" inputmode="numeric" maxlength="10" required>

            <label for="email">Correo</label>
            <input type="email" id="email" name="email" required>

            <button type="submit">Continuar</button>
        </form>

        <a class="enlace" href="{% url 'login_usuario' %}">Volver al inicio de sesión</a>
    </main>
</body>
</html>
