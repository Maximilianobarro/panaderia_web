{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alta de Usuario - Panadería Zulca</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>
<body>
    {% include 'core/_menu.html' %}

    <main class="form-card">
        <h1>Alta de Usuario</h1>

        {% if errores %}
        <section class="mensaje mensaje-error">
            <ul>
                {% for e in errores %}<li>{{ e }}</li>{% endfor %}
            </ul>
        </section>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <fieldset>
                <legend>Datos personales</legend>
                <label>DNI
                    <input type="number" name="dni" value="{{ datos.dni }}" required>
                </label>
                <label>Apellido
                    <input type="text" name="apellido" value="{{ datos.apellido }}" required>
                </label>
                <label>Nombre
                    <input type="text" name="nombre" value="{{ datos.nombre }}" required>
                </label>
                <label>Correo
                    <input type="email" name="email" value="{{ datos.email }}" required>
                </label>
            </fieldset>

            <fieldset>
                <legend>Acceso</legend>
                <label>Perfil (Rol)
                    <select name="rol" required>
                        <option value="">-- Elegir --</option>
                        {% for r in roles %}
                        <option value="{{ r.id_rol }}"{% if datos.rol == r.id_rol|stringformat:"s" %} selected{% endif %}>{{ r.nombre_rol }}</option>
                        {% endfor %}
                    </select>
                </label>
                <label>Contraseña
                    <input type="password" name="clave_inicial" minlength="8" required autocomplete="new-password">
                </label>
                <label class="check">
                    <input type="checkbox" name="activo"{% if not datos or datos.activo %} checked{% endif %}>
                    Activo
                </label>
            </fieldset>

            <p><small>El nombre de usuario se genera automáticamente al guardar.</small></p>

            <p class="acciones">
                <button type="submit" class="boton">Crear usuario</button>
                <a href="{% url 'usuario_lista' %}" class="boton boton-secundario">Cancelar</a>
            </p>
        </form>
    </main>
</body>
</html>
