<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cambiar clave - Panadería Zulca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width:400px;">
        <h1 class="mb-4">Debés cambiar tu clave</h1>
        <p class="text-muted">Por seguridad, tenés que definir una contraseña nueva antes de continuar.</p>
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <form method="POST" class="bg-white p-4 rounded shadow-sm">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Nueva clave</label>
                <input type="password" name="clave_nueva" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Confirmar clave</label>
                <input type="password" name="clave_confirmar" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success">Guardar y continuar</button>
        </form>
    </div>
</body>
</html>
