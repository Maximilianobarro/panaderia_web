<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }} - Panadería Zulca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    {% include 'core/_menu.html' %}
    <div class="container mb-5">
        <h1 class="mb-4">{{ titulo }}</h1>

        <a href="{% url crear_url %}" class="btn btn-success mb-3">+ Nuevo</a>

        <table class="table table-bordered table-striped bg-white">
            <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Datos</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for objeto in objetos %}
                <tr>
                    <td>{{ objeto.pk }}</td>
                    <td>{{ objeto }}</td>
                    <td>
                        <a href="{% url editar_url objeto.pk %}" class="btn btn-sm btn-primary">Editar</a>
                        <a href="{% url borrar_url objeto.pk %}" class="btn btn-sm btn-danger">Borrar</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="text-center">No hay registros todavía.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
