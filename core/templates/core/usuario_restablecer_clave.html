<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Restablecer clave - Panadería Zulca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    {% include 'core/_menu.html' %}
    <div class="container mb-5">
        <h1 class="mb-4">Restablecer clave de {{ usuario.nombre_usuario }}</h1>
        <p class="text-muted">
            Se va a generar una contraseña nueva y aleatoria. El usuario deberá cambiarla
            obligatoriamente la próxima vez que inicie sesión.
        </p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-warning">Generar nueva clave</button>
            <a href="{% url 'usuario_lista' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>
</html>
